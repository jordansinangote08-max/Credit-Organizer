
name: Restore Credit Organizer Installment Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: claude/lucid-goldberg-sqom97
          fetch-depth: 0

      - name: Verify target and prepare restoration
        shell: bash
        run: |
          set -euo pipefail

          TARGET="c238cbe640b24acb9135a2afa3d3a5edcd4e71d7"
          BACKUP="backup-installment-${GITHUB_RUN_ID}"
          RESTORE="restore-installment-${GITHUB_RUN_ID}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git cat-file -e "${TARGET}^{commit}"

          SUBJECT="$(git show -s --format=%s "$TARGET")"
          EXPECTED="Keep installment progress across statements and sync bill removals"

          if [ "$SUBJECT" != "$EXPECTED" ]; then
            echo "Commit message does not match expected target"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "Target is not an ancestor of current branch"
            exit 1
          fi

          echo "Verified target: $TARGET"
          echo "Commit subject: $SUBJECT"

          git branch "$BACKUP" HEAD
          git push origin "$BACKUP"

          git switch -c "$RESTORE"
          git read-tree --reset -u "$TARGET"

          if git diff --cached --quiet; then
            echo "Already at the requested snapshot"
            exit 0
          fi

          git commit -m "Restore exact installment commit snapshot"
          git push -u origin "$RESTORE"

          echo "Backup: $BACKUP"
          echo "Restore: $RESTORE"
