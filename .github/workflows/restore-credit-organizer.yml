
name: Restore Credit Organizer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Credit Organizer
        uses: actions/checkout@v4
        with:
          ref: claude/lucid-goldberg-sqom97
          fetch-depth: 0

      - name: Back up and restore PR 29
        env:
          TARGET_SHA: 65b249d02d4b650d6ca8ddf67b3088dfda1caef3
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git cat-file -e "${TARGET_SHA}^{commit}"

          if ! git merge-base --is-ancestor "$TARGET_SHA" HEAD; then
            echo "::error::PR 29 commit is not in branch history."
            exit 1
          fi

          BACKUP="backup-credit-organizer-${GITHUB_RUN_ID}"
          RESTORE="restore-credit-organizer-${GITHUB_RUN_ID}"

          git branch "$BACKUP" HEAD
          git push origin "$BACKUP"

          git switch -c "$RESTORE"

          # Replace the index and working files with
          # the complete PR 29 snapshot.
          git read-tree --reset -u "$TARGET_SHA"

          if git diff --cached --quiet; then
            echo "No restoration changes needed."
            exit 0
          fi

          git commit -m "Restore Credit Organizer to PR 29"
          git push -u origin "$RESTORE"

          echo "Backup branch: $BACKUP" >> "$GITHUB_STEP_SUMMARY"
          echo "Restore branch: $RESTORE" >> "$GITHUB_STEP_SUMMARY"
