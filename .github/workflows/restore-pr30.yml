
name: Restore Credit Organizer to PR 30

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: claude/lucid-goldberg-sqom97
          fetch-depth: 0
          persist-credentials: true

      - name: Create exact PR 30 snapshot branch
        shell: bash
        env:
          TARGET: 720a2af
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin \
            claude/lucid-goldberg-sqom97

          git cat-file -e "${TARGET}^{commit}"

          if ! git merge-base --is-ancestor "$TARGET" HEAD; then
            echo "Target commit is not in current branch history."
            exit 1
          fi

          BACKUP="backup-pr30-${GITHUB_RUN_ID}"
          RESTORE="restore-pr30-${GITHUB_RUN_ID}"

          git branch "$BACKUP" HEAD
          git push origin "$BACKUP"

          git switch -c "$RESTORE"

          git read-tree --reset -u "$TARGET"

          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi

          git commit -m "Restore exact PR 30 merge snapshot"
          git push -u origin "$RESTORE"

          echo "Backup branch: $BACKUP"
          echo "Restore branch: $RESTORE"
